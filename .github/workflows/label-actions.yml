# This workflow is managed by gh actions-lock.

name: 'Label Actions'

on:
  issues:
    types: [labeled]
  discussion:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  discussions: write
  pull-requests: write

jobs:
  reaction:
    runs-on: ubuntu-slim
    steps:
      - uses: dessant/label-actions@v5.0.3
        with:
          github-token: ${{ github.token }}
