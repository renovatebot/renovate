name: 'Label Actions'

# NOTE that if adding any new events, these must be allowlisted via an Actions Policy due to its use of `pull_request_target`
# https://github.com/renovatebot/renovate/settings/actions/rules/12707
on:
  issues:
    types: [labeled]
  discussion:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: write
  discussions: write
  pull-requests: write

jobs:
  reaction:
    runs-on: ubuntu-slim
    steps:
      - uses: dessant/label-actions@65225c179d3b2502f6eda7b3d15101a3f412366b # v5.0.3
        with:
          github-token: ${{ github.token }}
