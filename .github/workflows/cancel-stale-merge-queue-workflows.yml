# This workflow is managed by gh actions-lock.
# based on https://github.com/PierreRAFFA/cancel-previous-runs-action/blob/main/.github/workflows/test.yaml
name: Cancel stale merge queue workflows
on:
  merge_group:
    types:
      - checks_requested

permissions:
  actions: write
  contents: read

jobs:
  cancel-previous-runs:
    runs-on: ubuntu-slim
    steps:
      - name: Cancel Previous Runs
        uses: pierreraffa/cancel-previous-runs-action@1.11
        with:
          workflow_names: '*'
