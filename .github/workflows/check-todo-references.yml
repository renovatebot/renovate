name: Check TODO References

on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  closed-issues:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check TODOs for issues closed by this PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const closingPattern = /\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?):?\s+#(\d+)\b/gi;
            const issueNumbers = new Set();

            for (const match of body.matchAll(closingPattern)) {
              issueNumbers.add(match[1]);
            }

            if (issueNumbers.size === 0) {
              core.info('No issues are closed by this pull request');
              return;
            }

            const references = [...issueNumbers].join('|');
            const todoPattern = `TODO.*#(${references})([^0-9]|$)`;
            const result = await exec.getExecOutput(
              'git',
              ['grep', '-n', '-E', todoPattern, '--', '.'],
              { ignoreReturnCode: true, silent: true },
            );

            if (result.exitCode === 1) {
              core.info('No TODOs reference issues closed by this pull request');
              return;
            }

            if (result.exitCode !== 0) {
              core.setFailed(`git grep failed: ${result.stderr}`);
              return;
            }

            core.setFailed(
              `Remove or update TODOs that reference issues closed by this pull request:\n${result.stdout}`,
            );
