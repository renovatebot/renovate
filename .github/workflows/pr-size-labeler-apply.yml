name: PR Size Labeler (apply)

# Privileged half of `pr-size-labeler.yml`. It runs from the default branch and
# never checks out or runs pull request code. The pull request number comes from
# an untrusted artifact, so it is validated against the triggering run first.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no pull request code is checked out or run, and the artifact is validated
    workflows:
      - PR Size Labeler
    types:
      - completed

permissions: {}

jobs:
  auto-label-pr:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifact of the triggering run
      pull-requests: write
    steps:
      - name: Download pull request number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-number
          path: ${{ runner.temp }}/pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(cat "$RUNNER_TEMP/pr-number/pr-number.txt")"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number"
            exit 1
          fi
          pr_head_sha="$(gh pr view "$pr_number" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          if [[ "$pr_head_sha" != "$HEAD_SHA" ]]; then
            echo "::notice::Pull request #$pr_number has moved on, skipping"
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      # A PR gets the smallest size whose line (additions + deletions) and file
      # limits both fit, and `size:xl` above all limits.
      - name: Label PR based on size
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          labels=(size:xs size:s size:m size:l size:xl)
          max_lines=(25 150 600 2500 5000)
          max_files=(1 10 25 50 100)

          pr="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json additions,deletions,changedFiles,labels)"
          lines="$(jq '.additions + .deletions' <<< "$pr")"
          files="$(jq '.changedFiles' <<< "$pr")"

          size=$(( ${#labels[@]} - 1 ))
          for i in "${!labels[@]}"; do
            if (( lines <= max_lines[i] && files <= max_files[i] )); then
              size=$i
              break
            fi
          done
          label="${labels[size]}"
          echo "Pull request #$PR_NUMBER: $lines lines in $files files, $label"

          args=()
          stale="$(jq -r --arg label "$label" '[.labels[].name | select(startswith("size:") and . != $label)] | join(",")' <<< "$pr")"
          if [[ -n "$stale" ]]; then
            args+=(--remove-label "$stale")
          fi
          if ! jq -e --arg label "$label" 'any(.labels[]; .name == $label)' <<< "$pr" > /dev/null; then
            args+=(--add-label "$label")
          fi
          if (( ${#args[@]} > 0 )); then
            gh pr edit "$PR_NUMBER" --repo "$REPO" "${args[@]}"
          fi
