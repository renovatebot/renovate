name: Mutation Testing

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sundays at 3am
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  mutation-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          os: ${{ runner.os }}

      - run: pnpm test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  mutation-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          os: ${{ runner.os }}

      - name: Get changed source files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'lib/**/*.ts' ':!lib/**/*.spec.ts' ':!lib/**/*.generated.ts' | tr '\n' ',')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "has_files=$( [ -n "$FILES" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Restore mutation incremental cache
        if: steps.changed.outputs.has_files == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/.stryker-incremental.json
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-incremental-${{ github.event.pull_request.number }}-

      - name: Run mutation tests on changed files
        if: steps.changed.outputs.has_files == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: pnpm test:mutation:changed "$CHANGED_FILES"

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changed.outputs.has_files == 'true'
        with:
          name: mutation-report
          path: reports/mutation/

      - name: Save mutation incremental cache
        if: always() && steps.changed.outputs.has_files == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/.stryker-incremental.json
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post PR comment
        if: always() && steps.changed.outputs.has_files == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = '## 🧬 Mutation Testing Results\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'));
              const files = Object.entries(report.files || {});
              if (files.length === 0) {
                throw new Error('report has no files');
              }
              let totalKilled = 0;
              let totalDetectable = 0;
              const rows = files.map(([file, data]) => {
                const mutants = data.mutants || [];
                const killed = mutants.filter((m) => m.status === 'Killed' || m.status === 'Timeout').length;
                const survived = mutants.filter((m) => m.status === 'Survived' || m.status === 'NoCoverage').length;
                const detectable = killed + survived;
                totalKilled += killed;
                totalDetectable += detectable;
                const score = detectable > 0 ? (killed / detectable) * 100 : 0;
                return { file, score, survived, killed, total: mutants.length };
              });
              const overallScore = totalDetectable > 0 ? (totalKilled / totalDetectable) * 100 : 0;
              body += `**Mutation Score:** ${overallScore.toFixed(1)}%\n\n`;
              body += '| File | Score | Survived | Killed | Total |\n|------|-------|----------|--------|-------|\n';
              for (const r of rows) {
                body += `| ${r.file} | ${r.score.toFixed(1)}% | ${r.survived} | ${r.killed} | ${r.total} |\n`;
              }
            } catch (e) {
              body += '_No mutation report generated (possibly no mutants in changed files)._\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes('🧬 Mutation Testing Results'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
