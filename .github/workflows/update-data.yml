# This workflow is managed by gh actions-lock.

name: 'Update static data'
on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

env:
  NODE_VERSION: 24

permissions: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    if: github.repository == 'renovatebot/renovate'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/setup@v3.1.1
        with:
          install: false
          runtime: node@${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mise
        uses: jdx/mise-action@v5.2.1
        with:
          # don't run `mise install`, but do install a version of `mise` itself
          install: false

      - name: Update static data
        run: pnpm run update-static-data

      - name: Run Prettier
        run: pnpm prettier-fix

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'chore/update-static-data'
          commit-message: 'feat(data): automatic update of static data'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'feat(data): automatic update of static data'
          assignees: viceice,secustor,jamietanna
