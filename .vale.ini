StylesPath = .vale/styles
MinAlertLevel = suggestion

# Vale also lints comments in code files, see https://docs.vale.sh/formats/code
[*.md]
BasedOnStyles = Renovate

[*.ts]
BasedOnStyles = Renovate
# Code comments are not user-facing text
Renovate.Contractions = NO

# Texts written by third parties keep their wording
[docs/usage/user-stories/*.md]
Renovate.Contractions = NO
Renovate.MendRenovateApp = NO

[{node_modules/**,**/__fixtures__/**,**/*.generated.ts,**/*.snap,tmp/**,.vale/**}]
BasedOnStyles =
