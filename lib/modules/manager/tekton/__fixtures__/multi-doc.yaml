---
kind: Pipeline
spec:
  tasks:
  - taskRef:
      bundle: gcr.io/tekton-releases/catalog/upstream/pipeline:1.0@sha256:01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
  finally:
  - taskRef:
      # the Bundle resolver takes precedence over the deprecated `bundle` field
      bundle: gcr.io/tekton-releases/catalog/upstream/ignored:1.0
      resolver: bundles
      params:
      - name: name
        value: pipeline-finally
      - name: bundle
        value: gcr.io/tekton-releases/catalog/upstream/pipeline-finally:1.0
---
kind: List
items:
- kind: TaskRun
  spec:
    taskRef:
      bundle: >-
        gcr.io/tekton-releases/catalog/upstream/list-task-run
    taskSpec:
      steps:
      - image: example.io/taskrun/spec/taskSpec/steps/0/image
      stepTemplate:
        image: example.io/taskrun/spec/taskSpec/stepTemplate/image
      sidecars:
      - image: example.io/taskrun/spec/taskSpec/sidecars/0/image
- kind: Task
  spec:
    steps:
    - image: example.io/task/spec/steps/0/image:v1.2.3
---
kind: PipelineRun
spec:
  pipelineRef:
    bundle: gcr.io/tekton-releases/catalog/upstream/ignored:1.0
    resolver: bundles
    # the deprecated `resource` attribute is used when `params` has no bundle
    resource:
    - name: bundle
      value: gcr.io/tekton-releases/catalog/upstream/pipeline-run-resolver:1.0
---
kind: PipelineRun
spec:
  pipelineSpec:
    tasks:
    - taskRef:
        bundle: true
---
kind: TriggerTemplate
spec:
  resourcetemplates:
  - kind: TaskRun
    spec:
      taskRef:
        bundle: gcr.io/tekton-releases/catalog/upstream/trigger-template-task-run
---
kind: StepAction
spec:
  image: example.io/stepaction/spec/image
---
