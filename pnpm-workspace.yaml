packages: []

savePrefix: ''
# updates are handled by Renovate itself
updateNotifier: false
# https://pnpm.io/cli/run
shellEmulator: true

allowBuilds:
  core-js-pure: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false
  re2: true

dedupePeers: true

catalog:
  esbuild: 0.28.2
  tar: 7.5.23
  vite: 8.3.8

overrides:
  esbuild: 'catalog:'
  katex@>=0.11.0 <0.18.2: 0.19.1
  re2js@>=2.2.0 <2.8.7: 2.10.0
  vite: 'catalog:'

ignoredOptionalDependencies:
  - dtrace-provider
  - moment
  - mv
  - safe-json-stringify

strictPeerDependencies: true

# in line with https://github.com/renovatebot/.github/blob/main/default.json,
# all non-Renovate or non-Containerbase packages should only be installed after
# 7 days
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@containerbase/base'
  - '@renovatebot/base-image'
  - '@renovatebot/detect-tools'
  - '@renovatebot/good-enough-parser'
  - '@renovatebot/osv-offline'
  - '@renovatebot/osv-offline-db'
  - '@renovatebot/pep440'
  - '@renovatebot/pgp'
  - '@renovatebot/ruby-semver'
  - '@containerbase/eslint-plugin'
  - '@containerbase/istanbul-reports-html'
  - '@containerbase/semantic-release-pnpm'
  # Renovate security update: glob@14.0.2
  - glob@14.0.2

provenance: true
